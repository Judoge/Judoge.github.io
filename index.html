    <script>
        /* 动态壁纸：任何设备、任何设置下都加载并播放 */
        (function () {
            try {
                var smallScreen = window.matchMedia('(max-width: 768px)').matches;
                var weakCpu = navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4;
                var src = (smallScreen || weakCpu) ? '/images/aero/bg-mobile.mp4' : '/images/aero/bg.mp4';

                var v = document.createElement('video');
                v.className = 'bg-video';
                v.autoplay = true;
                v.muted = true;
                v.loop = true;
                v.playsInline = true;
                v.preload = 'auto';
                v.setAttribute('playsinline', '');
                v.setAttribute('webkit-playsinline', '');
                v.setAttribute('muted', '');
                v.setAttribute('aria-hidden', 'true');
                v.poster = '/images/aero/bg-poster.jpg';
                var s = document.createElement('source');
                s.src = src;
                s.type = 'video/mp4';
                v.appendChild(s);
                document.body.insertBefore(v, document.body.firstChild);

                /* 兜底：部分浏览器（iOS 低电量模式等）会拦截自动播放，交互后重试 */
                var tryPlay = function () {
                    var p = v.play();
                    if (p && p.catch) {
                        p.catch(function () { /* 忽略，等下一次交互 */ });
                    }
                };
                v.addEventListener('loadeddata', tryPlay);
                v.addEventListener('canplay', tryPlay);
                ['touchstart', 'click', 'scroll', 'keydown'].forEach(function (evt) {
                    document.addEventListener(evt, tryPlay, { passive: true });
                });

                /* 页面切到后台时暂停解码，切回来再继续，避免长期占用 GPU/CPU */
                document.addEventListener('visibilitychange', function () {
                    if (document.hidden) {
                        v.pause();
                    } else if (v.paused) {
                        tryPlay();
                    }
                });
            } catch (e) { /* ignore */ }
        })();
    </script>
